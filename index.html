<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관상 풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽은 사진과 측정선(상법도), 오른쪽은 풀이. 좁은 화면에선 위아래로 쌓임. 쪽빛 먹과 인주 도장 색. */
:root {
  --paper: #F1F2F5;
  --surface: #FFFFFF;
  --ink: #1B2440;
  --muted: #5B6480;
  --line: #D4D8E2;
  --seal: #B3301C;
  --seal-soft: #F5E1DC;
  --guide: #2F5FA8;
  --display: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1320; --surface: #161D2D; --ink: #E3E6EE; --muted: #97A0B6;
    --line: #2A3349; --seal: #E2694C; --seal-soft: #3B231F; --guide: #7FA6E8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1320; --surface: #161D2D; --ink: #E3E6EE; --muted: #97A0B6;
  --line: #2A3349; --seal: #E2694C; --seal-soft: #3B231F; --guide: #7FA6E8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.65 var(--body);
  padding-inline: 16px; padding-block: 28px 56px;
}
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 28px; }

header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.seal {
  width: 64px; height: 64px; flex: none;
  border: 3px solid var(--seal); border-radius: 6px; color: var(--seal);
  display: grid; grid-template-columns: 1fr 1fr; place-items: center;
  font: 800 22px/1 var(--display); padding: 4px; transform: rotate(-4deg);
}
.seal span { writing-mode: vertical-rl; }
header h1 { margin: 0; font: 800 clamp(28px, 4vw, 38px)/1.15 var(--display); letter-spacing: -0.01em; }
header p { margin: 2px 0 0; color: var(--muted); max-width: 52ch; }

.grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.left { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 860px) { .left { position: static; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.consent input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--seal); flex: none; }
.consent b { color: var(--ink); font-weight: 600; }

.drop {
  margin-top: 12px; border: 1.5px dashed var(--line); border-radius: 8px;
  padding: 18px; text-align: center; display: grid; gap: 8px; justify-items: center;
  transition: border-color .15s, background .15s;
}
.drop.over { border-color: var(--seal); background: var(--seal-soft); }
.drop.locked { opacity: .55; }
.btn {
  font: 600 14px/1 var(--body); border-radius: 6px; padding: 11px 16px; cursor: pointer;
  border: 1px solid var(--seal); background: var(--seal); color: var(--surface);
}
.btn[disabled] { cursor: not-allowed; opacity: .5; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--guide); outline-offset: 2px; }
.drop small { color: var(--muted); font-size: 12.5px; }
.drop .row-actions { justify-content: center; }

.cam { display: grid; gap: 10px; }
.cam-frame { position: relative; border-radius: 8px; overflow: hidden; background: var(--ink); aspect-ratio: 100 / 105; max-width: 100%; }
.cam-frame video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.cam-guide { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam-guide ellipse { stroke: var(--surface); }
.cam-tip { margin: 0; font-size: 13px; color: var(--muted); }

.stage { position: relative; }
.stage canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--paper); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 12px/1.4 var(--mono); color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
.status { font-size: 13.5px; color: var(--muted); min-height: 1.4em; margin: 0; }
.status.err { color: var(--seal); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.right { display: grid; gap: 22px; min-width: 0; }
.badge { display: inline-block; font: 500 11.5px/1 var(--mono); letter-spacing: .06em; padding: 5px 8px; border-radius: 4px; background: var(--seal-soft); color: var(--seal); }
.badge.mine { background: var(--ink); color: var(--surface); }
.standouts h3 { margin: 0 0 10px; font: 800 20px/1.3 var(--display); }
.standouts ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.standouts li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; counter-increment: s; }
.standouts li::before { content: counter(s); grid-row: span 3; font: 800 22px/1 var(--display); color: var(--seal); padding-top: 2px; }
.standouts .palace { font: 700 12.5px var(--display); color: var(--seal); letter-spacing: .04em; }
.standouts b { font-weight: 600; font-size: 15.5px; }
.standouts li span:last-child { color: var(--muted); font-size: 14px; }
.warn { margin: 0; padding: 10px 12px; border-left: 3px solid var(--seal); background: var(--seal-soft); border-radius: 0 6px 6px 0; font-size: 13.5px; }

.verdict { display: grid; gap: 14px; }
.verdict h2 { margin: 0; font: 800 clamp(26px, 3.4vw, 34px)/1.2 var(--display); text-wrap: balance; }
.verdict h2 em { font-style: normal; color: var(--seal); }
.verdict .summary { margin: 0; font-size: 16px; max-width: 60ch; }
.verdict .facetext { margin: 0; color: var(--muted); max-width: 62ch; }

.elements { display: grid; gap: 7px; }
.el { display: grid; grid-template-columns: 74px minmax(0, 1fr) 42px; gap: 10px; align-items: center; font-size: 13px; }
.el .nm { font-family: var(--display); font-weight: 700; }
.el .bar { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.el .bar b { display: block; height: 100%; background: var(--muted); }
.el.top .bar b { background: var(--seal); }
.el .pc { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.group h3 { margin: 0 0 4px; font: 800 20px/1.3 var(--display); display: flex; align-items: baseline; gap: 10px; }
.group h3 small { font: 400 12px var(--mono); color: var(--muted); letter-spacing: .04em; }
.feat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); gap: 8px 22px; padding-block: 14px; border-top: 1px solid var(--line); }
@media (max-width: 560px) { .feat { grid-template-columns: minmax(0, 1fr); } }
.feat .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.feat .palace { font: 700 13px var(--display); color: var(--seal); letter-spacing: .04em; }
.feat .name { font-size: 13px; color: var(--muted); }
.feat .tag { width: 100%; font-weight: 600; font-size: 16px; }
.feat p { margin: 4px 0 0; max-width: 62ch; }
.feat .note { font-size: 12.5px; color: var(--muted); }

.gauge { align-self: center; display: grid; gap: 5px; }
.gauge .track { position: relative; height: 22px; }
.gauge .seg { position: absolute; top: 9px; height: 4px; background: var(--line); }
.gauge .seg.on { background: var(--ink); }
.gauge .tick { position: absolute; top: 5px; width: 1px; height: 12px; background: var(--muted); }
.gauge .dot { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--seal); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--seal); }
.gauge .val { font: 12px var(--mono); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.gauge .val b { color: var(--ink); font-weight: 500; }

details.raw summary { cursor: pointer; font-weight: 600; }
.tablewrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; font: 12.5px/1.4 var(--mono); width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }

footer { color: var(--muted); font-size: 12.5px; max-width: 80ch; display: grid; gap: 4px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="seal" aria-hidden="true"><span>觀</span><span>相</span></div>
    <div>
      <h1>관상 풀이</h1>
      <p>정면 얼굴 사진 한 장으로 얼굴 비율을 재고, 고전 상법의 기준에 따라 풀이합니다.</p>
    </div>
  </header>

  <div class="grid">
    <section class="left" aria-label="사진">
      <div class="panel">
        <label class="consent" for="consent">
          <input type="checkbox" id="consent">
          <span><b>사진 분석에 동의합니다.</b> 사진은 이 기기의 브라우저 안에서만 분석되며 서버로 전송하거나 저장하지 않습니다. 페이지를 닫으면 사라집니다.</span>
        </label>
        <div class="drop locked" id="drop">
          <div class="row-actions">
            <button class="btn" id="pick" type="button" disabled>사진 업로드</button>
            <button class="btn" id="shoot" type="button" disabled>사진 촬영</button>
          </div>
          <small id="dropHint">동의하면 사진을 올리거나 바로 찍을 수 있습니다.</small>
          <input type="file" id="photo" accept="image/*" hidden>
          <input type="file" id="cameraInput" accept="image/*" capture="user" hidden>
        </div>
      </div>

      <div class="panel stage">
        <canvas id="view" width="400" height="420" aria-label="측정선이 표시된 얼굴"></canvas>
        <div class="cam" id="cam" hidden>
          <div class="cam-frame">
            <video id="camVideo" playsinline muted></video>
            <svg class="cam-guide" viewBox="0 0 100 105" preserveAspectRatio="none" aria-hidden="true">
              <ellipse cx="50" cy="50" rx="27" ry="36" fill="none" stroke-width="0.8" stroke-dasharray="3 2"></ellipse>
            </svg>
          </div>
          <p class="cam-tip">얼굴을 점선 안에 맞추고 정면을 봐 주세요. 무표정이 가장 정확합니다.</p>
          <div class="row-actions">
            <button class="btn" id="snap" type="button">찍기</button>
            <button class="btn ghost" id="camCancel" type="button">취소</button>
          </div>
        </div>
        <div class="legend">
          <span><i style="background: var(--guide)"></i>삼정 기준선</span>
          <span><i style="background: var(--seal)"></i>이목구비 윤곽</span>
        </div>
      </div>

      <p class="status" id="status" role="status"></p>
      <div class="row-actions" id="actions" hidden>
        <button class="btn ghost" id="reset" type="button">사진 지우기</button>
      </div>
    </section>

    <section class="right" id="reading" aria-live="polite"></section>
  </div>

  <footer>
    <p>관상은 과학적으로 검증된 방법이 아닙니다. 이 풀이는 재미로만 보시고, 채용·평가 등 사람을 판단하는 데 쓰지 마세요.</p>
    <p>얼굴 측정: face-api (MIT 라이선스, 68점 랜드마크). 풀이: 마의상법·유장상법 등 고전 상법의 개념을 바탕으로 새로 쓴 문장.</p>
  </footer>
</div>

<script type="module" src="js/app.js?v=3"></script>
